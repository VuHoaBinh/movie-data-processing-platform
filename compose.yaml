services:
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT (kafka:29092) serves containers; PLAINTEXT_HOST (localhost:9092) serves
      # clients on the host, such as `streamlit run app.py` outside Docker.
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.0.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic watch-events --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic trending-results --partitions 1 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy

  flink-jobmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |-
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
        python.client.executable: /usr/bin/python3
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  flink-taskmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |-
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        python.client.executable: /usr/bin/python3
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    restart: unless-stopped

  flink-trending-job:
    build:
      context: .
      dockerfile: flink/Dockerfile
    command:
      - bash
      - -lc
      - >-
        until curl -fsS http://flink-jobmanager:8081/overview >/dev/null; do sleep 2; done;
        flink run -m flink-jobmanager:8081 -py /opt/flink/usrlib/flink_trending_job.py
    environment:
      FLINK_PROPERTIES: |-
        jobmanager.rpc.address: flink-jobmanager
        python.client.executable: /usr/bin/python3
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_WATCH_TOPIC: watch-events
      KAFKA_TREND_TOPIC: trending-results
      TREND_WINDOW_MINUTES: 5
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  event-producer:
    build:
      context: .
      dockerfile: Dockerfile.stream
    command: ["python", "src/kafka_event_producer.py", "--limit", "100000", "--rate", "500"]
    volumes:
      - ./data:/app/data:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_WATCH_TOPIC: watch-events
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  trending-materializer:
    build:
      context: .
      dockerfile: Dockerfile.stream
    command: ["python", "src/trending_materializer.py"]
    volumes:
      - ./data:/app/data
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TREND_TOPIC: trending-results
      OUTPUT_DIR: /app/data/processed
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_WATCH_TOPIC: watch-events
    depends_on:
      flink-trending-job:
        condition: service_started
      trending-materializer:
        condition: service_started
    restart: unless-stopped
