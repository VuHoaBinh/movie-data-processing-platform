services:
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT (kafka:29092) serves containers; PLAINTEXT_HOST (localhost:9092) serves
      # clients on the host, such as `streamlit run app.py` outside Docker.
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.0.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic watch-events --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic trending-results --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic live-user-engagement --partitions 1 --replication-factor 1 --config cleanup.policy=compact;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic live-movie-engagement --partitions 1 --replication-factor 1 --config cleanup.policy=compact
    depends_on:
      kafka:
        condition: service_healthy

  cassandra:
    image: cassandra:5.0
    ports:
      - "127.0.0.1:9042:9042" # giảm khả năng client từ máy khác truy cập qua cổng được xuất trên host.
    environment:
      CASSANDRA_CLUSTER_NAME: movie-analytics
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  cassandra-init:
    image: cassandra:5.0
    entrypoint: ["/bin/sh", "-c"]
    # Same schema twice: movie_analytics (Spark batch + live tables) and movie_analytics_flink (Flink batch).
    command:
      - >-
        cqlsh cassandra -f /sql/cassandra_schema.cql &&
        sed -e 's/\bmovie_analytics\b/movie_analytics_flink/g' /sql/cassandra_schema.cql > /tmp/flink_schema.cql &&
        cqlsh cassandra -f /tmp/flink_schema.cql
    volumes:
      - ./sql:/sql:ro
    depends_on:
      cassandra:
        condition: service_healthy

  flink-jobmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
    command: jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ./data:/opt/flink/data  # raw CSVs + warehouse for the Flink batch job
    environment:
      FLINK_PROPERTIES: |-
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
        python.client.executable: /usr/bin/python3
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  flink-taskmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
    command: taskmanager
    volumes:
      - ./data:/opt/flink/data
    environment:
      FLINK_PROPERTIES: |-
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        python.client.executable: /usr/bin/python3
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    restart: unless-stopped

  # Flink speed layer (alternative engine): BR2 trending, BR6/BR8 per-day running totals.
  flink-speed-job:
    build:
      context: .
      dockerfile: flink/Dockerfile
    command:
      - bash
      - -lc
      - >-
        until curl -fsS http://flink-jobmanager:8081/overview >/dev/null; do sleep 2; done;
        flink run -m flink-jobmanager:8081 -py /opt/flink/usrlib/flink_speed_sql_job.py
    environment:
      FLINK_PROPERTIES: |-
        jobmanager.rpc.address: flink-jobmanager
        python.client.executable: /usr/bin/python3
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_WATCH_TOPIC: watch-events
      KAFKA_TREND_TOPIC: trending-results
      KAFKA_USER_ENGAGEMENT_TOPIC: live-user-engagement
      KAFKA_MOVIE_ENGAGEMENT_TOPIC: live-movie-engagement
      TREND_WINDOW_SECONDS: ${TREND_WINDOW_SECONDS:-300}
      WATERMARK_SECONDS: ${WATERMARK_SECONDS:-60}
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  # Flink batch branch (alternative engine), on demand after the shared ingest (part of spark-batch):
  #   docker compose --profile flink-batch run --rm flink-load
  # runs flink-batch (raw zone -> flink_curated -> flink_analytics, Parquet) and then loads the result into
  # Cassandra keyspace movie_analytics_flink. Compare with Spark:
  #   docker compose run --rm --no-deps benchmark python -m src.compare_batch_engines
  flink-batch:
    profiles: ["flink-batch"]
    build:
      context: .
      dockerfile: flink/Dockerfile
    command:
      - bash
      - -lc
      - >-
        until curl -fsS http://flink-jobmanager:8081/overview >/dev/null; do sleep 2; done;
        flink run -m flink-jobmanager:8081 -py /opt/flink/usrlib/flink_batch_sql_job.py --data-dir /opt/flink/data
    volumes:
      - ./data:/opt/flink/data
    environment:
      FLINK_PROPERTIES: |-
        jobmanager.rpc.address: flink-jobmanager
        python.client.executable: /usr/bin/python3
    depends_on:
      flink-jobmanager:
        condition: service_healthy

  flink-load:
    profiles: ["flink-batch"]
    image: movie-analytics-app:latest
    command: ["python", "-m", "src.load_serving"]
    volumes:
      - ./data:/app/data
    environment:
      CASSANDRA_HOST: cassandra
    depends_on:
      flink-batch:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully

  # Replays the last day of watch_history in watch_timestamp order (REPLAY_SPEED x real time) and keeps
  # sending heartbeats on the simulated clock. The clock lives in Cassandra, so a restart resumes.
  event-producer:
    build:
      context: .
      dockerfile: Dockerfile.stream
    command: ["python", "-m", "src.kafka_event_producer"]
    volumes:
      - ./data:/app/data:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_WATCH_TOPIC: watch-events
      CASSANDRA_HOST: cassandra
      REPLAY_SPEED: ${REPLAY_SPEED:-60}
      REPLAY_DAY: ${REPLAY_DAY:-auto}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    restart: on-failure

  # Flink results (Kafka) -> Cassandra live_trending / live_user_engagement / live_movie_engagement.
  speed-materializer:
    build:
      context: .
      dockerfile: Dockerfile.stream
    command: ["python", "-m", "src.speed_materializer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TREND_TOPIC: trending-results
      KAFKA_USER_ENGAGEMENT_TOPIC: live-user-engagement
      KAFKA_MOVIE_ENGAGEMENT_TOPIC: live-movie-engagement
      CASSANDRA_HOST: cassandra
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Spark speed layer (main engine): BR2, BR6, BR8 -> Cassandra *_spark tables.
  spark-streaming:
    build:
      context: .
      dockerfile: Dockerfile
    image: movie-analytics-app:latest
    command: ["python", "-m", "src.spark_speed_layer"]
    ports:
      - "4040:4040"  # Spark UI of the speed layer (Structured Streaming tab), always on
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_WATCH_TOPIC: watch-events
      CASSANDRA_HOST: cassandra
      TREND_WINDOW_SECONDS: ${TREND_WINDOW_SECONDS:-300}
      WATERMARK_SECONDS: ${WATERMARK_SECONDS:-60}
      TRIGGER_SECONDS: ${TRIGGER_SECONDS:-5}
      CHECKPOINT_DIR: /checkpoints/speed
    volumes:
      - spark-checkpoint:/checkpoints  # offsets and window state survive container restarts
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Kafka watch-events -> raw zone (headerless CSV in data/warehouse/landing), read by the next batch run.
  stream-archiver:
    build:
      context: .
      dockerfile: Dockerfile
    image: movie-analytics-app:latest
    command: ["python", "-m", "src.stream_archiver"]
    volumes:
      - ./data:/app/data
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_WATCH_TOPIC: watch-events
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Tests and benchmarks inside the stack: `docker compose run --rm --no-deps benchmark <command>`.
  benchmark:
    profiles: ["tools"]
    image: movie-analytics-app:latest
    working_dir: /app
    entrypoint: []
    command: ["python", "-m", "pytest", "-q"]
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./tests:/app/tests
      - ./benchmarks:/app/benchmarks
      - ./sql:/app/sql
      - ./generate_data.py:/app/generate_data.py
      - ./pytest.ini:/app/pytest.ini
    environment:
      CASSANDRA_HOST: cassandra
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PYTHONPATH: /app

  # One-shot Spark batch: raw CSV -> Hive/Parquet lake (data/warehouse) -> Cassandra serving tables.
  spark-batch:
    build:
      context: .
      dockerfile: Dockerfile
    image: movie-analytics-app:latest
    command: ["python", "-m", "src.spark_batch_job"]
    ports:
      - "4041:4040"  # Spark UI of the start-up batch run (only while it runs)
    volumes:
      - ./data:/app/data
    environment:
      CASSANDRA_HOST: cassandra
      REPLAY_DAY: ${REPLAY_DAY:-auto}
    depends_on:
      cassandra-init:
        condition: service_completed_successfully

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: movie-analytics-app:latest
    ports:
      - "8501:8501"
      - "4042:4040"  # Spark UI of a batch started with the dashboard's "Refresh batch (Spark)" button
    volumes:
      - ./data:/app/data
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_WATCH_TOPIC: watch-events
      CASSANDRA_HOST: cassandra
    depends_on:
      spark-batch:
        condition: service_completed_successfully
      flink-speed-job:
        condition: service_started
      speed-materializer:
        condition: service_started
    restart: unless-stopped

volumes:
  cassandra-data:
  spark-checkpoint: